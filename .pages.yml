# Pages CMS config (https://pagescms.org/docs). Defines what the client can edit.
# Anything not listed here (video, logo, layout, colours, nav) is locked in code.
media:
  input: public/assets
  output: /assets
  extensions: [jpg, jpeg, png, webp]

content:
  - name: home-hero
    label: Home – Top Banner
    type: file
    path: src/content/home-hero.json
    fields:
      - name: heading
        label: Heading
        type: string
        required: true
        options: { maxlength: 40 }
      - name: body
        label: Intro text
        type: text
        required: true
        options: { maxlength: 220 }
      - name: image
        label: Image (shown if the video can't play)
        type: image
        required: true
      - name: imageAlt
        label: Describe the image in a sentence (for blind visitors and Google)
        type: string
        required: true
        options: { maxlength: 125 }

  - name: events
    label: Events
    type: file
    path: src/content/events.json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string, required: true, options: { maxlength: 60 } }
          - { name: date, label: Date, type: date, required: true, options: { format: "yyyy-MM-dd" } }
          - { name: time, label: Time (e.g. 10AM – 12PM), type: string, options: { maxlength: 30 } }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Describe the image in a sentence, type: string, required: true, options: { maxlength: 125 } }
          - { name: description, label: Description, type: text, required: true, options: { maxlength: 400 } }
